[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "TheDrawCode"
description = "A machine learning system that accurately predicts soccer match draws and goal patterns using ensemble methods and advanced feature engineering techniques, with a focus on high-precision results for betting applications."
requires-python = "==3.9.19"
authors = [
    { name="Richard Szita", email="szitar.9@gmail.com" },
]
readme = "README.md"
license = "MIT" 
dynamic = ["version"] # Added for dynamic versioning

# https://pypi.org/classifiers/
classifiers = [
    # Existing:
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    # Added from template:
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.9",
    "Typing :: Typed",
]

