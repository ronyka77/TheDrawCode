[project.urls] # Preserved from original file
"Homepage" = "https://github.com/ronyka77/TheDrawCode"
"Bug Tracker" = "https://github.com/ronyka77/TheDrawCode/issues"
Repository = "https://github.com/ronyka77/TheDrawCode" # Added from template structure

# ---- Dev dependencies ----
[project.dependency-groups] # Renamed from template's [dependency-groups] for compatibility
dev = [
    "pytest>=8.3.5",
    "ruff>=0.11.0",
    "codespell>=2.4.1",
    "rich>=13.9.4",
    "basedpyright>=1.28.2",
    "funlog>=0.2.0",
    "mkdocs-material", # Added for mkdocs theme if used
    "pymdown-extensions", # Added for mkdocs extensions
]

# [project.scripts]
# Add script entry points here.
# TheDrawCode = "thedrawcode.cli:main" # Example placeholder

# ---- Dynamic versioning ----
[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = "true"

# ---- Build configuration ----
[tool.hatch.build.targets.wheel]
# The source location for the package. Find all packages under src/.
packages = ["src/"]

# ---- Tool Settings ----
[tool.ruff]
line-length = 100 # Set as desired

[tool.ruff.lint]
select = [
    "E", "F", "UP", "B", "I", # Basic set
]
ignore = [
    "E501", "E402", "E731", # Common ignores
    # Rules conflicting with ruff formatter:
    "W191", "E111", "E114", "E117", "D206", "D300", "Q000", "Q001", "Q002", "Q003", "COM812", "COM819", "ISC002",
]

[tool.basedpyright]
include = ["src", "tests", "devtools"]
reportIgnoreCommentWithoutRule = false
reportUnnecessaryTypeIgnoreComment = false
reportMissingTypeStubs = false
reportUnusedCallResult = false

[tool.codespell]
# ignore-words-list = ""
# skip = ""

[tool.pytest.ini_options]
python_files = ["*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = [
    "src",
    "tests",
]
norecursedirs = []
filterwarnings = []
